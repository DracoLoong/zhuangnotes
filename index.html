<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Zhuang Notes</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Docsify 主题 -->
  <link
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
  >

<!-- 独立分类展开逻辑 -->
<script>
(function () {
  'use strict';

  function initSidebar() {
    var sidebar = document.querySelector('.sidebar-nav');
    if (!sidebar) return;

    sidebar.querySelectorAll('li').forEach(function (li) {
      // 找到当前分类自己的子列表
      var childList = Array.from(li.children).find(function (el) {
        return el.tagName === 'UL' || el.tagName === 'OL';
      });

      if (!childList) return;

      // 避免重复创建按钮
      var link = Array.from(li.children).find(function (el) {
        return el.tagName === 'A';
      });

      // Docsify 的分类标题通常是直接子节点中的链接。
      // 如果链接在其他容器中，则不改动原始 DOM 结构。
      if (!link) return;

      var button = Array.from(li.children).find(function (el) {
        return el.classList &&
          el.classList.contains('category-toggle');
      });

      if (!button) {
        button = document.createElement('button');
        button.type = 'button';
        button.className = 'category-toggle';
        button.textContent = '▶';
        button.setAttribute('aria-label', '展开或收起分类');

        button.style.cssText =
          'margin-right:6px;border:0;background:transparent;' +
          'cursor:pointer;color:inherit;padding:4px;';

        li.insertBefore(button, link);
      }

      // 初始化时保留现有展开状态；
      // 只在第一次初始化时设置默认状态。
      if (childList.dataset.independentInit !== '1') {
        childList.dataset.independentInit = '1';

        var isFirstLevel = li.parentElement === sidebar;
        childList.hidden = !isFirstLevel;
      }

      button.setAttribute(
        'aria-expanded',
        String(!childList.hidden)
      );

      if (button.dataset.bound === '1') return;
      button.dataset.bound = '1';

      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();

        // 仅修改当前分类的子列表，不关闭其他分类
        childList.hidden = !childList.hidden;

        button.setAttribute(
          'aria-expanded',
          String(!childList.hidden)
        );

        button.textContent = childList.hidden ? '▶' : '▼';
      });
    });
  }

  function start() {
    initSidebar();

    var sidebar = document.querySelector('.sidebar-nav');
    if (!sidebar) return;

    var observer = new MutationObserver(function () {
      initSidebar();
    });

    observer.observe(sidebar, {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</head>

<body>
  <div id="app">加载中...</div>

  <!-- Docsify 配置 -->
  <script>
    window.$docsify = {
      name: 'Zhuang Notes',
      repo: '',

      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,

      // 保留原有配置：默认显示第一级分类的内容
      sidebarDisplayLevel: 1,
      hideOtherSidebarContent: false,

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      search: 'auto'
    };
  </script>

  <!-- Docsify 核心库 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- 搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- 独立分类展开逻辑：不再加载原折叠插件 -->
  <script>
    (function () {
      'use strict';

      var initializedLists = new WeakSet();

      function initSidebar() {
        var sidebar = document.querySelector('.sidebar-nav');

        if (!sidebar) return;

        var items = sidebar.querySelectorAll('li');

        items.forEach(function (li) {
          // 只处理直接属于当前分类的子列表
          var childList = null;

          Array.from(li.children).forEach(function (child) {
            if (
              child.tagName === 'UL' ||
              child.tagName === 'OL'
            ) {
              childList = child;
            }
          });

          if (!childList) return;

          var row = null;
          var existingRow = Array.from(li.children).find(function (child) {
            return child.classList &&
              child.classList.contains('category-row');
          });

          if (existingRow) {
            row = existingRow;
          } else {
            row = document.createElement('div');
            row.className = 'category-row';

            // 将分类标题及其链接放入标题行
            Array.from(li.childNodes).forEach(function (node) {
              if (
                node === childList ||
                (node.nodeType === 1 &&
                  (node.tagName === 'UL' || node.tagName === 'OL'))
              ) {
                return;
              }

              row.appendChild(node);
            });

            li.insertBefore(row, childList);
          }

          li.classList.add('has-independent-toggle');

          var button = row.querySelector('.category-toggle');

          if (!button) {
            button = document.createElement('button');
            button.type = 'button';
            button.className = 'category-toggle';
            button.setAttribute('aria-label', '展开或收起分类');

            var arrow = document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = '▶';
            arrow.setAttribute('aria-hidden', 'true');

            button.appendChild(arrow);
            row.insertBefore(button, row.firstChild);
          }

          // 同一个分类只初始化一次，保留用户的展开状态
          if (!initializedLists.has(childList)) {
            initializedLists.add(childList);

            // 根级分类默认展开，其余层级默认收起
            var parentList = li.parentElement;
            var isRootCategory =
              parentList &&
              parentList.classList.contains('sidebar-nav');

            childList.hidden = !isRootCategory;
          }

          button.setAttribute(
            'aria-expanded',
            String(!childList.hidden)
          );

          button.onclick = function (event) {
            event.preventDefault();
            event.stopPropagation();

            // 只切换当前分类，不操作其他分类
            childList.hidden = !childList.hidden;

            button.setAttribute(
              'aria-expanded',
              String(!childList.hidden)
            );
          };
        });
      }

      // Docsify 会在路由切换、侧边栏更新时重新渲染 DOM。
      // 监听变化，确保新生成的分类也能独立展开。
      function startObserver() {
        if (!document.body) {
          document.addEventListener(
            'DOMContentLoaded',
            startObserver,
            { once: true }
          );
          return;
        }

        var observer = new MutationObserver(function () {
          initSidebar();
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true
        });

        initSidebar();
      }

      startObserver();
    })();
  </script>
</body>
</html>
